{% extends "global/base.html" %}


{% block content %}

<h1>
    Collection BrickMarket
</h1>


<div class="products-grid">

{% for product in products %}

<article class="product-card">

    <h2>
        {{ product.name }}
    </h2>

    <p>
        {{ product.price }} €
    </p>


    <a href="{% url 'product_details' product.slug %}">
        Voir le produit
    </a>

</article>

{% empty %}

<p>
    Aucun produit disponible.
</p>

{% endfor %}

</div>


{% endblock %}
